limitations: "Formalizes invariants of the repository's own discrete definitions: finite-prime Bruhat-Tits trees, a hand-coded 3-class reduction of unicyclic Tate-curve BTZ horizons, a bridge-edge transport cost model (with kernel-verified primal entry non-negativity), direct finite-graph edge-sum curved Gauss-Bonnet conservation over List (WeightedEdge n) on Fin n (closed in v1.7.0), the actual discrete radial ultrametric/Vladimirov operator D_K and Kozyrev-Haar wavelets on Z/p^n Z with exact eigenfunction and [D_K, J]=0 parity theorems (closed in v1.7.0), and finite weighted-graph cuts. Lean still does not define the full complex Fourier-basis hybrid Hamiltonian H_theta, continuum PDE time evolution, the O(V) floating-point bulk solver, positivity of T above the BF bound, or the full-neighbor-to-3-class BTZ symmetry reduction. Six-kernel lake comparator --paranoid covers the 12 targets in lean/comparator.json and their dependency closure; all 202 audited declarations are checked by Lean (lake build, leanchecker, and Ubuntu CI lake check --paranoid). Does NOT solve the continuum adelic unification problem (Mega-Atlas SUB-032), any quantum-gravity problem, or prove asymptotic n -> infinity spectral mixing bounds."
