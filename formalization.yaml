limitations: "Formalizes invariants of the repository's own discrete definitions across 11 pure zero-Mathlib Lean 4.35.0 proof modules (all 17 Lean files < 1,000 lines): finite-prime Bruhat-Tits trees, literal (p+2)x(p+2) full-graph unicyclic BTZ symmetry reduction and primal-dual optimal transport (closed in v1.8.0), operator-level matrix block-diagonality and odd-prime orthogonal conjugate eigenvector multiplicity >= 2 over Z[i]^N (closed in v1.8.0), finite weighted gauge-covariant graph Laplacian positivity T > 0 with end-to-end Sherman-Morrison den >= 1 discharge and RatQ tree Schur pivot positivity (closed in v1.8.0), arbitrary-degree inhomogeneous bridge-edge transport duality, direct finite-graph edge-sum curved Gauss-Bonnet conservation over List (WeightedEdge n) on Fin n, discrete radial ultrametric/Vladimirov operator D_K and Kozyrev-Haar wavelets on Z/p^n Z with exact eigenfunction and [D_K, J]=0 parity theorems, and finite weighted-graph cuts. Lean still works over exact integer/Gaussian-integer/rational rings (Int, CInt, RatQ) rather than IEEE-754 floating-point or real/complex manifolds: it does not formalize the full floating-point DFT complex matrix H_theta (whose irrational roots of unity lie outside Z[i]), continuum PDE time evolution, the floating-point O(V) JS solver implementation, or tachyonic negative-mass BF-window positivity (m^2 in (m^2_BF, 0)). Six-kernel lake comparator --paranoid covers all 15 targets in lean/comparator.json and their dependency closure; 100.0% of public theorems (250/250) are audited in VerifyAxioms.lean and checked by Lean (lake build, leanchecker --fresh, and Ubuntu CI lake check --paranoid). Does NOT solve the continuum adelic unification problem (Mega-Atlas SUB-032), any quantum-gravity problem, or prove asymptotic n -> infinity spectral mixing bounds."
