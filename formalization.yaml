limitations: "Formalizes invariants of the repository's own discrete definitions: finite-prime Bruhat-Tits trees, a hand-coded 3-class reduction of unicyclic Tate-curve BTZ horizons, a hand-coded bridge-edge transport cost model, and finite weighted-graph cuts. Lean does not define the Vladimirov operator, Kozyrev wavelets, the hybrid Hamiltonian H_theta, time evolution or the O(V) bulk solver; no theorem sums curvature over the edges of a finite tree. The six-kernel comparator covers the 10 targets in lean/comparator.json and their dependency closure. The 149-declaration count includes literal or definitional identities (e.g. 1 = 2 - 1). Does NOT solve the continuum adelic unification problem (Mega-Atlas SUB-032), any quantum-gravity problem, or prove asymptotic n -> infinity spectral mixing bounds."
