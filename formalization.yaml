limitations: "Formalizes invariants of the repository's own discrete definitions: finite-prime Bruhat-Tits trees, a hand-coded 3-class reduction of unicyclic Tate-curve BTZ horizons, a hand-coded bridge-edge transport cost model (now with kernel-verified primal entry non-negativity in v1.6.0), and finite weighted-graph cuts. Lean does not define the Vladimirov operator, Kozyrev wavelets, the hybrid Hamiltonian H_theta, time evolution or the O(V) bulk solver; no theorem sums curvature over the edges of a finite tree. Six-kernel lake comparator --paranoid covers the 10 targets in lean/comparator.json and their dependency closure; all 148 audited declarations are checked by Lean (lake build, leanchecker, and Ubuntu CI lake check --paranoid). Does NOT solve the continuum adelic unification problem (Mega-Atlas SUB-032), any quantum-gravity problem, or prove asymptotic n -> infinity spectral mixing bounds."
