name: Formal Verification, Exact Rational Audit, Mutants & Manuscript CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  node-theorems-and-mutants:
    name: Node.js 10-Theorem Suite, 8 Planted Mutants & Benchmarks (Exp A-H)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run 10 automated mathematical & physical theorems
        run: npm test
      - name: Run 8 planted negative-mutant falsification checks (8/8 killed)
        run: npm run falsify
      - name: Run all 8 reproducible discovery benchmarks (Exp A-H)
        run: npm run discover

  python-exact-and-checksums:
    name: Independent Exact-Rational Falsifier & SHA-256 Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run zero-dependency exact Fraction, Q(i), metadata & checksum audit
        run: python scripts/verify_exact.py --check-checksums
      - name: Verify cryptographic SHA-256 manifest with standard sha256sum
        run: sha256sum -c CHECKSUMS.sha256

  lean4-formal-proofs:
    name: Lean 4 (v4.35.0) 101-Theorem Zero-Sorry & Axiom Allowlist Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan & Lean 4 toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Verify zero sorry / admit / axiom / native_decide / unsafe in Lean library
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          files = [Path("lean/UltrametricaProofs.lean")] + sorted(Path("lean/UltrametricaProofs").glob("*.lean"))
          for p in files:
              txt = p.read_text(encoding="utf-8")
              txt = re.sub(r"/-.*?-/", "", txt, flags=re.S)
              txt = re.sub(r"--[^\n]*", "", txt)
              m = re.search(r"\b(sorry|admit|axiom|native_decide|unsafe)\b", txt)
              if m:
                  raise SystemExit(f"ERROR: Forbidden token '{m.group(1)}' in executable code of {p}")
          print(f"PASS: Zero sorry/admit/axiom/native_decide/unsafe across {len(files)} Lean library files.")
          PY
      - name: Clean-build Lean 4 library & audit all 101 declarations via VerifyAxioms.lean
        working-directory: lean
        run: |
          lake clean
          lake build
          lake env lean VerifyAxioms.lean | tee axioms.log
          python3 - <<'PY'
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          count = 0
          for line in open("axioms.log", encoding="utf-8"):
              line = line.strip()
              if "sorryAx" in line or "native_decide" in line:
                  raise SystemExit(f"ERROR: Forbidden axiom detected: {line}")
              if "depends on axioms:" in line:
                  count += 1
                  used = {t.strip() for t in line.split("[", 1)[1].rsplit("]", 1)[0].split(",") if t.strip()}
                  if not used.issubset(allowed):
                      raise SystemExit(f"ERROR: Forbidden axiom {used - allowed} in: {line}")
              elif "does not depend on any axioms" in line:
                  count += 1
          assert count >= 101, f"Expected >= 101 audited declarations, got {count}"
          print(f"PASS: All {count} Lean 4 declarations strictly within {sorted(allowed)} (or zero axioms).")
          PY

  latex-manuscript-and-arxiv:
    name: AMS-LaTeX PDF Build & Standalone arXiv Tarball Check (Tectonic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/tectonic
          tectonic --version
      - name: Compile paper/main.tex, assert zero warnings, & test standalone arXiv bundle
        run: python scripts/package_dist.py
      - name: Upload compiled manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: Donahue_2026_Ultrametrica
          path: dist/Donahue_2026_Ultrametrica.pdf
