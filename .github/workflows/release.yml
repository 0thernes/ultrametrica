name: Release Frozen Artifacts, SHA256SUMS & Build Provenance

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Package & Publish Verified Release Assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify full Node + Python + Timestamp + SHA-256 suite prior to publishing
        run: |
          npm run verify:all
          npm run examples
          python reference/padic_oracle.py
          python scripts/check_readme_axioms.py
          python scripts/check_citations.py
          python scripts/check_blueprint.py
          python scripts/stamp_manifest.py --verify
          python scripts/verify_exact.py --check-checksums
      - name: Stage release artifacts and compute SHA256SUMS
        run: |
          mkdir -p release-assets
          cp dist/Donahue_2026_Ultrametrica.pdf release-assets/
          cp dist/arxiv_submission.tar.gz release-assets/
          cp results/lean4-audit.txt release-assets/
          cp results/discovery-benchmarks.json release-assets/
          cp results/stats-eval.json release-assets/
          cp results/perf-benchmarks.json release-assets/
          cp results/citation-audit.json release-assets/
          cp CHECKSUMS.sha256 release-assets/
          cp data/CHECKSUMS.sha256.tsr release-assets/
          cp data/CHECKSUMS.sha256.ots release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS)
          cat release-assets/SHA256SUMS
      - name: Generate SLSA build provenance attestation for release artifacts
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            release-assets/Donahue_2026_Ultrametrica.pdf
            release-assets/arxiv_submission.tar.gz
            release-assets/lean4-audit.txt
            release-assets/CHECKSUMS.sha256.tsr
            release-assets/CHECKSUMS.sha256.ots
            release-assets/SHA256SUMS
      - name: Create or update GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "ULTRAMETRICA $TAG" \
              --notes-file CHANGELOG.md
          fi
