name: Mathematical / Scientific Falsification Report
description: Submit a counterexample, statement-fidelity mismatch, numerical discrepancy, or falsification against Theorems I-VI or Experiments A-I.
title: "[falsification]: "
labels: ["falsification"]
body:
  - type: dropdown
    id: finding_class
    attributes:
      label: Finding Class (10-Class Taxonomy)
      options:
        - error
        - hole
        - bug
        - problem
        - conflict
        - blindspot
        - concern
        - gap
        - issue
        - dilemma
    validations:
      required: true
  - type: input
    id: claim_id
    attributes:
      label: Claim ID / Theorem / Experiment
      placeholder: "e.g., C-THM-2, Theorem V-Global, Experiment I H2"
    validations:
      required: true
  - type: textarea
    id: counterexample
    attributes:
      label: Counterexample or Discrepancy Details
      description: Exact parameters (p, n, L, sigma, alpha, seed) and observed vs. claimed values.
    validations:
      required: true
  - type: textarea
    id: script
    attributes:
      label: Reproducible Verification Script / Lean Snippet
      render: shell
    validations:
      required: true
