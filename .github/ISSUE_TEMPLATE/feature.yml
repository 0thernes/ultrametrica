name: Feature / Mathematical Extension Proposal
description: Propose a new theorem formalization, experiment, preset, or architectural improvement.
title: "[proposal]: "
labels: ["gap"]
body:
  - type: dropdown
    id: finding_class
    attributes:
      label: Finding Class (10-Class Taxonomy)
      options:
        - gap
        - issue
        - dilemma
        - concern
        - blindspot
        - problem
        - conflict
        - bug
        - error
        - hole
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Scientific or Engineering Motivation
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Falsifiable Acceptance Criteria
      description: How can this addition be independently verified (Lean theorem, exact Fraction check, property test)?
    validations:
      required: true
