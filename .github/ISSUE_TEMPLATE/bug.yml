name: Bug report
description: Report a reproducible bug, numerical conservation drift, WebGL2 shader error, AudioWorklet issue, or Lean 4 build failure
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in **ULTRAMETRICA**. Please include exact prime `p`, precision depth `n`, topology (`Pure AdS` vs `BTZ`), and hardware/runtime versions for deterministic reproduction.
  - type: textarea
    id: summary
    attributes:
      label: Summary & Observed Symptoms
      description: What happened vs. what the invariant or specification requires?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Deterministic Reproduction Steps
      placeholder: |
        1. Run `npm test` or launch `npm start`
        2. Select prime p=3, topology BTZ Black Hole, experiment ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime, Lean 4, OS & GPU/Browser
      placeholder: "Windows 11, RTX 5070 Ti, Node v25.8.2, Lean v4.35.0, Chrome"
    validations:
      required: true
