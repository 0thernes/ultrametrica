name: Bug / Defect Report
description: Report a bug, error, issue, gap, hole, or blindspot in the engine, observatory, server, or build.
title: "[finding]: "
labels: ["bug"]
body:
  - type: dropdown
    id: finding_class
    attributes:
      label: Finding Class (10-Class Taxonomy)
      description: Select the exact finding class from Build Standard R5.
      options:
        - bug
        - error
        - issue
        - problem
        - concern
        - dilemma
        - conflict
        - gap
        - hole
        - blindspot
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Exact Reproduction Steps
      description: Commands, URL permalink, or minimal script reproducing the finding.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Observed Behavior
      description: Include exact error output, tolerance violations, or console logs.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment (OS, Node/Python/Lean/Browser version)
      placeholder: "Windows 11 / Ubuntu 24.04, Node 22, Python 3.13, Chrome 131"
    validations:
      required: true
