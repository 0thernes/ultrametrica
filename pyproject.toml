[project]
name = "ultrametrica-verification"
version = "1.4.1"
description = "Zero-dependency Python stdlib exact-rational falsifier, differential oracle, vector figure generator, and arXiv packager for ULTRAMETRICA."
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["lean/.lake", "paper/build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E701", "E741"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
files = ["scripts", "reference"]
